spring.application.name=prod

# Configurația pentru baza de date MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
# Fusul orar pentru aplicație
spring.jackson.time-zone=Europe/Bucharest
# JVM Timezone - forzăm timezone-ul pentru întreaga aplicație
spring.jvm.timezone=Europe/Bucharest
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurația JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Bucharest

# Configurația serverului
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Configurația Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging - Redus pentru a evita spam-ul în consolă
logging.level.com.scutelnic.rutex=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.session=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Session Configuration - Set to 15 days to allow remember me functionality
spring.session.timeout=15d
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 0 * * * *
spring.session.jdbc.table-name=SPRING_SESSION

# Server Session Configuration - Set to 15 days to allow remember me functionality
server.servlet.session.timeout=15d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.max-age=1296000

# Remember Me Configuration
app.session.remember-me.timeout=15d
app.session.default.timeout=30m

# Translation API Configuration
translation.api.url=https://api.mymemory.translated.net/get
translation.api.key=

# Google Places API Configuration
google.places.api.key=${GOOGLE_PLACES_API_KEY}
google.places.api.base-url=https://maps.googleapis.com/maps/api/place

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Favicon Configuration
spring.mvc.favicon.enabled=true

# Email Configuration (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.from=contact@rutex.md
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email addresses for different purposes
app.email.contact=contact@rutex.md
app.email.noreply=noreply@rutex.md
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.debug=false

server.tomcat.basedir=${java.io.tmpdir}/tomcat

# Multipart file upload configuration (for Cloudinary)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tomcat configuration
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# reCAPTCHA Configuration
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.enabled=true
