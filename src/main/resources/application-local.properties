spring.application.name=local
spring.config.import=optional:file:.env[.properties]

# Configurația pentru baza de date MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
# Fusul orar pentru aplicație
spring.jackson.time-zone=Europe/Bucharest
# JVM Timezone - forzăm timezone-ul pentru întreaga aplicație
spring.jvm.timezone=Europe/Bucharest
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurația JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Bucharest
spring.jpa.open-in-view=false

# Configurația serverului
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Configurația Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging - Redus pentru a evita spam-ul în consolă
logging.level.com.scutelnic.rutex=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.session=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Session Configuration - Set to 15 days to allow remember me functionality
spring.session.timeout=15d
spring.session.store-type=redis

# Redis Configuration (Session Store)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Server Session Configuration - Set to 15 days to allow remember me functionality
server.servlet.session.timeout=15d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.max-age=1296000

# Remember Me Configuration
app.session.remember-me.timeout=15d
app.session.default.timeout=30m

# Translation API Configuration
translation.api.url=https://api.mymemory.translated.net/get
translation.api.key=

# Google Places API Configuration
google.places.api.key=${GOOGLE_PLACES_API_KEY}
google.places.api.base-url=https://maps.googleapis.com/maps/api/place

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Favicon Configuration
spring.mvc.favicon.enabled=true

# Email Configuration (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.from=contact@rutex.md
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Email addresses for different purposes
app.email.contact=contact@rutex.md
app.email.noreply=noreply@rutex.md


server.tomcat.basedir=${java.io.tmpdir}/tomcat

# Multipart file upload configuration (for Cloudinary)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Tomcat multipart configuration
server.tomcat.max-swallow-size=20MB
server.tomcat.max-http-form-post-size=20MB

# reCAPTCHA Configuration
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.enabled=false
app.base-url=https://rutex.md
app.data.cleanup.locations=true

# IndexNow is disabled locally by default
indexnow.enabled=${INDEXNOW_ENABLED:}
indexnow.key=${INDEXNOW_KEY:}
indexnow.endpoint=${INDEXNOW_ENDPOINT:}

# OpenAI route SEO content generation
openai.api-key=${OPENAI_API_KEY:}
openai.api.base-url=${OPENAI_API_BASE_URL:https://api.openai.com/v1}
openai.route-seo.model=${OPENAI_ROUTE_SEO_MODEL:gpt-4.1-mini}

# Web Push Configuration
app.push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:contact@rutex.md}

# Facebook Page Posting
facebook.api.base-url=${FACEBOOK_API_BASE_URL:https://graph.facebook.com}
facebook.api.version=${FACEBOOK_API_VERSION:}
facebook.page-id=${FACEBOOK_PAGE_ID:}
facebook.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:}
facebook.image.width=${FACEBOOK_IMAGE_WIDTH:1200}
facebook.image.height=${FACEBOOK_IMAGE_HEIGHT:630}
facebook.post.enabled=${FACEBOOK_POST_ENABLED:true}
facebook.post.text-format-enabled=true
facebook.post.text-format-preset-id=688479024672716
facebook.post.text-format-max-length=0
