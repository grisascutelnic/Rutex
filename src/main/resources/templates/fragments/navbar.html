<!-- Navigation Fragment -->
<nav class="navbar" th:fragment="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <a th:href="@{'/' + ${currentLanguage}}" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fas fa-car"></i>
                <span th:text="${translations != null and translations.containsKey('nav.brand') ? translations.get('nav.brand') : 'Rutex'}">Rutex</span>
            </a>
        </div>
        <div class="nav-menu">
            <a th:href="@{'/' + ${currentLanguage}}" class="nav-link" th:text="${translations != null and translations.containsKey('nav.home') ? translations.get('nav.home') : 'Acasă'}">Acasă</a>
            <a th:href="@{'/' + ${currentLanguage} + '/rides'}" class="nav-link" th:text="${translations != null and translations.containsKey('nav.rides') ? translations.get('nav.rides') : 'Călătorii'}">Călătorii</a>
            <a th:href="@{'/' + ${currentLanguage} + '/about'}" class="nav-link" th:text="${translations != null and translations.containsKey('nav.about') ? translations.get('nav.about') : 'Despre'}">Despre</a>
            <a th:href="@{'/' + ${currentLanguage} + '/contact'}" class="nav-link" th:text="${translations != null and translations.containsKey('nav.contact') ? translations.get('nav.contact') : 'Contact'}">Contact</a>
        </div>
        <div class="nav-language">
            <div class="language-selector">
                <div class="lang-dropdown" id="lang-dropdown">
                    <button class="lang-btn" id="lang-btn" type="button">
                        <span class="current-lang" th:text="${currentLanguage == 'ro' ? 'RO' : 'RU'}">RO</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="lang-dropdown-content" id="lang-dropdown-content">
                        <a href="#" class="lang-option" data-lang="ro" th:class="${currentLanguage == 'ro' ? 'lang-option active' : 'lang-option'}">
                            <span class="lang-flag">🇷🇴</span>
                            <span class="lang-name">Română</span>
                        </a>
                        <a href="#" class="lang-option" data-lang="ru" th:class="${currentLanguage == 'ru' ? 'lang-option active' : 'lang-option'}">
                            <span class="lang-flag">🇷🇺</span>
                            <span class="lang-name">Русский</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="nav-auth" id="nav-auth">
            <!-- Show user info if logged in -->
            <div th:if="${currentUser}" class="nav-user">
                <a th:href="@{'/' + ${currentLanguage} + '/profile'}" class="nav-profile" title="Profilul meu">
                    <span class="user-identity">
                        <i class="fas fa-user-circle"></i>
                        <span class="user-name" th:text="${currentUser.firstName}">User</span>
                    </span>
                    <!-- Role indicators -->
                    <span th:if="${currentUser.roles != null and currentUser.roles.?[name == 'ROLE_ADMIN'].size() > 0}"
                          class="role-indicator admin">ADMIN</span>
                    <span th:if="${currentUser.roles != null and currentUser.roles.?[name == 'ROLE_MOD'].size() > 0}"
                          class="role-indicator moderator">MODERATOR</span>
                </a>
                <a th:if="${currentUser.roles != null and currentUser.roles.?[name == 'ROLE_ADMIN'].size() > 0}" 
                   th:href="@{'/' + ${currentLanguage} + '/users'}" class="nav-link admin-link" title="Administrare Utilizatori">
                    <i class="fas fa-users-cog"></i> <span th:text="${translations != null and translations.containsKey('nav.admin') ? translations.get('nav.admin') : 'Administrare'}">Administrare</span>
                </a>
                    <div class="notification-wrapper">
                        <span class="notification-label" th:text="${translations != null and translations.containsKey('nav.notifications') ? translations.get('nav.notifications') : 'Notificări'}">Notificări</span>
                        <button class="notification-bell" id="notification-bell" type="button"
                                th:aria-label="${translations != null and translations.containsKey('nav.notifications') ? translations.get('nav.notifications') : 'Notificări'}">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge" id="notification-badge" hidden>0</span>
                        </button>
                    <div class="notification-dropdown" id="notification-dropdown">
                        <div class="notification-header">
                            <span class="notification-title" th:text="${translations != null and translations.containsKey('nav.notifications') ? translations.get('nav.notifications') : 'Notificări'}">Notificări</span>
                            <button class="notification-mark-all" id="notification-mark-all" type="button"
                                    th:text="${translations != null and translations.containsKey('nav.notifications_mark_all') ? translations.get('nav.notifications_mark_all') : 'Marchează toate'}">
                                Marchează toate
                            </button>
                        </div>
                        <div class="notification-push" id="notification-push" hidden>
                            <div class="notification-push-text" id="notification-push-text"
                                 th:text="${translations != null and translations.containsKey('nav.push_prompt') ? translations.get('nav.push_prompt') : 'Activează notificările pe telefon'}">
                                Activează notificările pe telefon
                            </div>
                            <button class="notification-push-button" id="notification-push-button" type="button"
                                    th:text="${translations != null and translations.containsKey('nav.push_enable') ? translations.get('nav.push_enable') : 'Activează'}"
                                    th:attr="data-disable-text=${translations != null and translations.containsKey('nav.push_disable') ? translations.get('nav.push_disable') : 'Dezactivează'},
                                             data-enable-text=${translations != null and translations.containsKey('nav.push_enable') ? translations.get('nav.push_enable') : 'Activează'}">
                                Activează
                            </button>
                        </div>
                        <div class="notification-push-status" id="notification-push-status"
                             th:attr="data-enabled-text=${translations != null and translations.containsKey('nav.push_enabled') ? translations.get('nav.push_enabled') : 'Notificările sunt active.'},
                                      data-blocked-text=${translations != null and translations.containsKey('nav.push_blocked') ? translations.get('nav.push_blocked') : 'Notificările sunt blocate în browser.'}"
                             hidden>
                            Notificările sunt active.
                        </div>
                        <div class="notification-list" id="notification-list"></div>
                        <div class="notification-empty" id="notification-empty"
                             th:text="${translations != null and translations.containsKey('nav.notifications_empty') ? translations.get('nav.notifications_empty') : 'Nu ai notificări'}">
                            Nu ai notificări
                        </div>
                    </div>
                </div>
                <button class="btn-logout" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> <span th:text="${translations != null and translations.containsKey('nav.logout') ? translations.get('nav.logout') : 'Deconectare'}">Deconectare</span>
                </button>
            </div>
            
            <!-- Show login button if not logged in -->
            <a th:unless="${currentUser}" th:href="@{'/' + ${currentLanguage} + '/login'}" class="btn-login" id="login-btn" th:text="${translations != null and translations.containsKey('nav.login') ? translations.get('nav.login') : 'Conectare'}">Conectare</a>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</nav>
