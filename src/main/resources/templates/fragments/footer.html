<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Footer Fragment -->
    <footer class="footer" th:fragment="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Rutex</h3>
                <p th:text="${translations != null and translations.containsKey('footer.tagline') ? translations.get('footer.tagline') : 'Conectăm oamenii prin călătorii împărtășite'}">Conectăm oamenii prin călătorii împărtășite</p>
            </div>
            <div class="footer-section">
                <h4 th:text="${translations != null and translations.containsKey('footer.useful_links') ? translations.get('footer.useful_links') : 'Link-uri utile'}">Link-uri utile</h4>
                <a th:href="@{'/' + ${currentLanguage} + '/about'}" th:text="${translations != null and translations.containsKey('footer.about_us') ? translations.get('footer.about_us') : 'Despre noi'}">Despre noi</a>
                <a th:href="@{'/' + ${currentLanguage} + '/terms'}" th:text="${translations != null and translations.containsKey('footer.terms') ? translations.get('footer.terms') : 'Termeni și condiții'}">Termeni și condiții</a>
                <a th:href="@{'/' + ${currentLanguage} + '/privacy'}" th:text="${translations != null and translations.containsKey('footer.privacy') ? translations.get('footer.privacy') : 'Politica de confidențialitate'}">Politica de confidențialitate</a>
            </div>
            <div class="footer-section">
                <h4 th:text="${translations != null and translations.containsKey('footer.contact') ? translations.get('footer.contact') : 'Contact'}">Contact</h4>
                <a href="mailto:contact@rutex.md">contact@rutex.md</a>
            </div>
        </div>
        <div class="footer-bottom">
                            <p th:text="${translations != null and translations.containsKey('footer.copyright') ? translations.get('footer.copyright') : '© 2025 Rutex. Toate drepturile rezervate.'}">&copy; 2025 Rutex. Toate drepturile rezervate.</p>
        </div>
    </footer>
</body>
</html>
