<!-- Language Selector Fragment -->
<div class="language-selector" th:fragment="language-selector">
    <div class="lang-dropdown">
        <button class="lang-btn" id="lang-btn">
            <span class="current-lang" th:text="${currentLanguage == 'ro' ? 'RO' : 'RU'}">RO</span>
            <i class="fas fa-chevron-down"></i>
        </button>
        <div class="lang-dropdown-content" id="lang-dropdown">
            <a href="#" class="lang-option" data-lang="ro" th:class="${currentLanguage == 'ro' ? 'lang-option active' : 'lang-option'}">
                <span class="lang-flag">🇷🇴</span>
                <span class="lang-name">Română</span>
            </a>
            <a href="#" class="lang-option" data-lang="ru" th:class="${currentLanguage == 'ru' ? 'lang-option active' : 'lang-option'}">
                <span class="lang-flag">🇷🇺</span>
                <span class="lang-name">Русский</span>
            </a>
        </div>
    </div>
</div>

<script th:inline="javascript">
// Language selector functionality
(function() {
    function initLanguageSelector() {
        const langBtn = document.getElementById('lang-btn');
        const langDropdown = document.getElementById('lang-dropdown');
        const langOptions = document.querySelectorAll('.lang-option');
        
        if (!langBtn || !langDropdown) {
            console.warn('Language selector elements not found');
            return;
        }
        
        console.log('Initializing language selector...');
        
        // Toggle dropdown
        langBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            console.log('Language button clicked');
            langDropdown.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!langBtn.contains(e.target)) {
                langDropdown.classList.remove('show');
            }
        });
        
        // Handle language selection
        langOptions.forEach(option => {
            option.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const selectedLang = this.getAttribute('data-lang');
                const currentLang = /*[[${currentLanguage}]]*/ 'ro';
                
                console.log('Language selected:', selectedLang, 'Current:', currentLang);
                
                if (selectedLang !== currentLang) {
                    changeLanguage(selectedLang);
                }
                
                langDropdown.classList.remove('show');
            });
        });
        
        function changeLanguage(language) {
            console.log('Changing language to:', language);
            fetch('/api/change-language', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'language=' + encodeURIComponent(language)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Language change response:', data);
                if (data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                }
            })
            .catch(error => {
                console.error('Error changing language:', error);
            });
        }
    }
    
    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLanguageSelector);
    } else {
        initLanguageSelector();
    }
})();
</script>
