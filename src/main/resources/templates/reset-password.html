<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetează parola - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1><i class="fas fa-lock"></i> <span th:text="${translations != null and translations.containsKey('reset_password.title') ? translations.get('reset_password.title') : 'Resetează parola'}">Resetează parola</span></h1>
                        <p th:text="${translations != null and translations.containsKey('reset_password.subtitle') ? translations.get('reset_password.subtitle') : 'Introduceți noua parolă pentru contul dvs.'}">Introduceți noua parolă pentru contul dvs.</p>
                    </div>

                    <form id="reset-password-form" class="auth-form">
                        <input type="hidden" id="token" name="token" th:value="${token}">
                        
                        <div class="form-group">
                            <label for="newPassword">
                                <i class="fas fa-lock"></i>
                                <span th:text="${translations != null and translations.containsKey('reset_password.new_password') ? translations.get('reset_password.new_password') : 'Parola nouă'}">Parola nouă</span>
                            </label>
                            <div class="password-input-wrapper">
                                <input type="password" id="newPassword" name="newPassword" th:placeholder="${translations != null and translations.containsKey('reset_password.new_password_placeholder') ? translations.get('reset_password.new_password_placeholder') : 'Introduceți parola nouă'}" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('newPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">
                                <i class="fas fa-lock"></i>
                                <span th:text="${translations != null and translations.containsKey('reset_password.confirm_password') ? translations.get('reset_password.confirm_password') : 'Confirmă parola'}">Confirmă parola</span>
                            </label>
                            <div class="password-input-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" th:placeholder="${translations != null and translations.containsKey('reset_password.confirm_password_placeholder') ? translations.get('reset_password.confirm_password_placeholder') : 'Confirmați parola nouă'}" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="reset-btn" class="auth-btn">
                            <i class="fas fa-save"></i>
                            <span th:text="${translations != null and translations.containsKey('reset_password.submit') ? translations.get('reset_password.submit') : 'Salvează parola nouă'}">Salvează parola nouă</span>
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p><span th:text="${translations != null and translations.containsKey('reset_password.back_to_login') ? translations.get('reset_password.back_to_login') : 'Înapoi la'}">Înapoi la</span> <a th:href="@{'/' + ${currentLanguage} + '/login'}" class="auth-link" onclick="saveCurrentUrlAndRedirect(event, this.href)" th:text="${translations != null and translations.containsKey('reset_password.login') ? translations.get('reset_password.login') : 'logare'}">logare</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="/js/password-toggle.js"></script>
    <script src="/js/reset-password.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
