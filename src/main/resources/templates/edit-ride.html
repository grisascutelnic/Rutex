<!DOCTYPE html>
<html lang="ro" th:lang="${currentLanguage}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editează o cursă existentă pe Rutex.md. Modifică detaliile cursei tale și actualizează informațiile. Simplu și rapid pentru șoferi din Moldova.">
    <meta name="keywords" content="editează cursă, modifică cursă, ride sharing Moldova, actualizează cursă, transport Moldova">
    <meta name="author" content="Rutex">
    <title th:text="${currentLanguage == 'ru' ? 'Редактировать объявление - Rutex' : 'Editează anunț - Rutex'}">Editează anunț - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/phone-visibility-confirmation.css?v=1.3">
    <link rel="stylesheet" href="/css/styles.css?v=1.47">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">
    <link rel="stylesheet" href="/css/ride-form.css?v=3.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
</head>
<body class="add-ride-page">
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="add-ride-container">
                <div th:replace="~{fragments/ride-form :: rideForm(true)}"></div>
            </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 th:text="${translations != null and translations.containsKey('add_ride.preview_title') ? translations.get('add_ride.preview_title') : (currentLanguage == 'ru' ? 'Предварительный просмотр поездки' : 'Previzualizare Cursă')}">Previzualizare Cursă</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal()" th:text="${translations != null and translations.containsKey('add_ride.cancel') ? translations.get('add_ride.cancel') : (currentLanguage == 'ru' ? 'Отмена' : 'Anulează')}">Anulează</button>
                <button type="button" class="btn btn-primary" onclick="submitRide()" th:text="${translations != null and translations.containsKey('editRide.confirmUpdate') ? translations.get('editRide.confirmUpdate') : (currentLanguage == 'ru' ? 'Подтвердить изменения' : 'Confirmă Actualizarea')}">Confirmă Actualizarea</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="/js/script.js?v=1.8"></script>
    <script src="/js/locality-autocomplete.js"></script>
    <script src="/js/ride-form-language.js?v=1.0"></script>
    <script src="/js/ride-form-controls.js?v=1.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="/js/profile-phone-input.js?v=1.0"></script>
    <script src="/js/phone-visibility-confirmation.js?v=1.5"></script>
    <script src="/js/edit-ride.js?v=3.0"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/city-translations.js"></script>
    <script src="/js/package-translations.js"></script>
    <script src="/js/edit-ride-translations.js?v=1.1"></script>
    <script src="/js/floating-button.js"></script>
</body>
</html>
