<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai uitat parola - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1><i class="fas fa-key"></i> <span th:text="${translations != null and translations.containsKey('forgot_password.title') ? translations.get('forgot_password.title') : 'Ai uitat parola'}">Ai uitat parola</span></h1>
                        <p th:text="${translations != null and translations.containsKey('forgot_password.subtitle') ? translations.get('forgot_password.subtitle') : 'Introduceți adresa de email pentru a reseta parola'}">Introduceți adresa de email pentru a reseta parola</p>
                    </div>

                    <form id="forgot-password-form" class="auth-form">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                <span th:text="${translations != null and translations.containsKey('forgot_password.email') ? translations.get('forgot_password.email') : 'Email'}">Email</span>
                            </label>
                            <input type="email" id="email" name="email" th:placeholder="${translations != null and translations.containsKey('forgot_password.email_placeholder') ? translations.get('forgot_password.email_placeholder') : 'Introduceți adresa de email'}" required>
                        </div>

                        <!-- reCAPTCHA v2 - visible with Romanian language -->
                        <div class="form-group recaptcha-container">
                            <div class="g-recaptcha" data-sitekey="6LcpV7YrAAAAAHhJ9BEloK394AXxl7-IEeYaYBRN" data-theme="light"></div>
                        </div>

                        <button type="submit" id="reset-btn" class="auth-btn">
                            <i class="fas fa-paper-plane"></i>
                            <span th:text="${translations != null and translations.containsKey('forgot_password.submit') ? translations.get('forgot_password.submit') : 'Trimite link de resetare'}">Trimite link de resetare</span>
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p><span th:text="${translations != null and translations.containsKey('forgot_password.remember_password') ? translations.get('forgot_password.remember_password') : 'Vă amintiți parola?'}">Vă amintiți parola?</span> <a th:href="@{'/' + ${currentLanguage} + '/login'}" class="auth-link" onclick="saveCurrentUrlAndRedirect(event, this.href)" th:text="${translations != null and translations.containsKey('forgot_password.back_to_login') ? translations.get('forgot_password.back_to_login') : 'Conectează-te aici'}">Conectează-te aici</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

            <!-- reCAPTCHA v2 Script with Romanian language -->
        <script src="https://www.google.com/recaptcha/api.js?hl=ro"></script>
    
    <script src="/js/forgot-password.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
