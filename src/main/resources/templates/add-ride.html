<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Postează o cursă nouă pe Rutex.md. Împărtășește drumul tău și economisește costurile de transport. Simplu și rapid pentru șoferi din Moldova.">
    <meta name="keywords" content="postează cursă, adaugă cursă, ride sharing Moldova, împărtășește drumul, transport Moldova">
    <meta name="author" content="Rutex">
    <title>Adaugă Cursă - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/styles.css?v=1.39">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
</head>
<body class="add-ride-page">
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="add-ride-container">
                <form id="add-ride-form" class="add-ride-form">
                    <h3 class="section-title"><i class="fas fa-car"></i> <span th:text="${translations != null and translations.containsKey('add_ride.ride_type') ? translations.get('add_ride.ride_type') : 'Tipul de Transport'}">Tipul de Transport</span></h3>
                    
                    <div class="form-group">
                        <div class="ride-type-selection">
                            <div class="ride-type-option">
                                <input type="radio" id="ride-type-passengers-only" name="rideType" value="passengers-only" checked>
                                <label for="ride-type-passengers-only" class="ride-type-label">
                                    <div class="ride-type-icon">
                                        <i class="fas fa-users"></i>
                                    </div>
                                    <div class="ride-type-content">
                                        <h4 th:text="${translations != null and translations.containsKey('add_ride.passengers_only.title') ? translations.get('add_ride.passengers_only.title') : 'Transport Pasageri'}">Transport Pasageri</h4>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="ride-type-option">
                                <input type="radio" id="ride-type-packages-only" name="rideType" value="packages-only">
                                <label for="ride-type-packages-only" class="ride-type-label">
                                    <div class="ride-type-icon">
                                        <i class="fas fa-box"></i>
                                    </div>
                                    <div class="ride-type-content">
                                        <h4 th:text="${translations != null and translations.containsKey('add_ride.packages_only.title') ? translations.get('add_ride.packages_only.title') : 'Transport Colete'}">Transport Colete</h4>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="ride-type-option">
                                <input type="radio" id="ride-type-passengers-and-packages" name="rideType" value="passengers-and-packages">
                                <label for="ride-type-passengers-and-packages" class="ride-type-label">
                                    <div class="ride-type-icon">
                                        <i class="fas fa-users"></i>
                                        <i class="fas fa-box"></i>
                                    </div>
                                    <div class="ride-type-content">
                                        <h4 th:text="${translations != null and translations.containsKey('add_ride.passengers_and_packages.title') ? translations.get('add_ride.passengers_and_packages.title') : 'Transport Pasageri și Colete'}">Transport Pasageri și Colete</h4>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <h3 class="section-title"><i class="fas fa-map-marker-alt"></i> <span th:text="${translations != null and translations.containsKey('add_ride.route_info') ? translations.get('add_ride.route_info') : 'Informații Rute'}">Informații Rute</span></h3>
                    
                    <div class="form-group">
                        <label for="from-location" th:text="${translations != null and translations.containsKey('add_ride.from') ? translations.get('add_ride.from') : 'De la:'}">De la:</label>
                        <div class="location-input-container">
                            <input type="text" id="from-location" name="fromLocation" class="locality-input" th:placeholder="${translations != null and translations.containsKey('add_ride.from_placeholder') ? translations.get('add_ride.from_placeholder') : 'Introduceți localitatea de plecare'}" autocomplete="off" required>
                            <div id="from-suggestions" class="suggestions-dropdown"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="to-location" th:text="${translations != null and translations.containsKey('add_ride.to') ? translations.get('add_ride.to') : 'Până la:'}">Până la:</label>
                        <div class="location-input-container">
                            <input type="text" id="to-location" name="toLocation" class="locality-input" th:placeholder="${translations != null and translations.containsKey('add_ride.to_placeholder') ? translations.get('add_ride.to_placeholder') : 'Introduceți localitatea de destinație'}" autocomplete="off" required>
                            <div id="to-suggestions" class="suggestions-dropdown"></div>
                        </div>
                    </div>

                    <h3 class="section-title"><i class="fas fa-calendar-alt"></i> <span th:text="${translations != null and translations.containsKey('add_ride.travel_details') ? translations.get('add_ride.travel_details') : 'Detalii Călătorie'}">Detalii Călătorie</span></h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="travel-date" th:text="${translations != null and translations.containsKey('add_ride.date') ? translations.get('add_ride.date') : 'Data călătoriei:'}">Data călătoriei:</label>
                            <div class="input-with-icon">
                                <input type="text" id="travel-date" name="travelDate" th:placeholder="${translations != null and translations.containsKey('add_ride.select_date') ? translations.get('add_ride.select_date') : 'Selectați data'}" autocomplete="off" required>
                                <i class="fas fa-calendar calendar-icon"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="departure-time" th:text="${translations != null and translations.containsKey('add_ride.time') ? translations.get('add_ride.time') : 'Ora plecării:'}">Ora plecării:</label>
                            <div class="input-with-icon time-input-wrapper" onclick="this.querySelector('input').showPicker?.()">
                                <input type="time" id="departure-time" name="departureTime" value="00:00" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" id="seats-group">
                            <label for="available-seats" th:text="${translations != null and translations.containsKey('add_ride.seats') ? translations.get('add_ride.seats') : 'Locuri disponibile:'}">Locuri disponibile:</label>
                            <input type="number" id="available-seats" name="availableSeats" min="1" max="100" value="1" autocomplete="off" required>
                        </div>
                        <div class="form-group" id="vehicle-group">
                            <label for="vehicle-select" th:text="${translations != null and translations.containsKey('add_ride.vehicle') ? translations.get('add_ride.vehicle') : 'Vehicul:'}">Vehicul:</label>
                            <select id="vehicle-select" name="vehicleId" required
                                    th:attr="data-placeholder=${translations != null and translations.containsKey('add_ride.vehicle_select') ? translations.get('add_ride.vehicle_select') : 'Alegeți un transport'},
                                             data-add-new=${translations != null and translations.containsKey('add_ride.vehicle_add_new') ? translations.get('add_ride.vehicle_add_new') : '+ Adaugă vehicul nou'},
                                             data-label=${translations != null and translations.containsKey('add_ride.vehicle') ? translations.get('add_ride.vehicle') : 'Vehicul'},
                                             data-select-error=${translations != null and translations.containsKey('add_ride.vehicle_select_error') ? translations.get('add_ride.vehicle_select_error') : 'Selectați un vehicul pentru această cursă.'},
                                             data-fill-error=${translations != null and translations.containsKey('add_ride.vehicle_fill_error') ? translations.get('add_ride.vehicle_fill_error') : 'Completați marca, culoarea și numărul mașinii.'},
                                             data-save-success=${translations != null and translations.containsKey('add_ride.vehicle_saved') ? translations.get('add_ride.vehicle_saved') : 'Vehicul salvat și selectat.'}"></select>
                            <div class="vehicle-help" id="vehicle-help" th:text="${translations != null and translations.containsKey('add_ride.vehicle_help') ? translations.get('add_ride.vehicle_help') : 'Alege vehiculul pentru această cursă.'}">Alege vehiculul pentru această cursă.</div>
                        </div>
                    </div>

                    <div class="vehicle-form" id="vehicle-form" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="vehicle-make" th:text="${translations != null and translations.containsKey('add_ride.vehicle_make') ? translations.get('add_ride.vehicle_make') : 'Marca:'}">Marca:</label>
                                <input type="text" id="vehicle-make" autocomplete="off" placeholder="Ex: Toyota">
                            </div>
                            <div class="form-group">
                                <label for="vehicle-color" th:text="${translations != null and translations.containsKey('add_ride.vehicle_color') ? translations.get('add_ride.vehicle_color') : 'Culoare:'}">Culoare:</label>
                                <input type="text" id="vehicle-color" autocomplete="off" placeholder="Ex: Alb">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="vehicle-plate" th:text="${translations != null and translations.containsKey('add_ride.vehicle_plate') ? translations.get('add_ride.vehicle_plate') : 'Număr:'}">Număr:</label>
                                <input type="text" id="vehicle-plate" autocomplete="off" placeholder="Ex: ABC 123">
                            </div>
                        </div>
                    </div>
                    


                    <h3 class="section-title"><i class="fas fa-info-circle"></i> <span th:text="${translations != null and translations.containsKey('add_ride.additional_info') ? translations.get('add_ride.additional_info') : 'Informații Suplimentare'}">Informații Suplimentare</span></h3>
                    
                    <div class="form-group">
                        <label for="description" th:text="${translations != null and translations.containsKey('add_ride.description') ? translations.get('add_ride.description') : 'Descriere (opțional):'}">Descriere (opțional):</label>
                        <textarea id="description" name="description" rows="4" th:placeholder="${translations != null and translations.containsKey('add_ride.description_placeholder') ? translations.get('add_ride.description_placeholder') : 'Detalii despre cursă, condiții speciale, etc.'}"></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            <span th:text="${translations != null and translations.containsKey('add_ride.terms') ? translations.get('add_ride.terms') : 'Sunt de acord cu'}">Sunt de acord cu</span> <a th:href="@{'/' + ${currentLanguage} + '/terms'}" class="auth-link" th:text="${translations != null and translations.containsKey('add_ride.terms_link') ? translations.get('add_ride.terms_link') : 'Termenii și Condițiile'}">Termenii și Condițiile</a>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <span th:text="${translations != null and translations.containsKey('add_ride.submit') ? translations.get('add_ride.submit') : 'Adaugă Cursa'}">Adaugă Cursa</span>
                        </button>
                    </div>
                </form>
            </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 th:text="${translations != null and translations.containsKey('add_ride.preview_title') ? translations.get('add_ride.preview_title') : 'Previzualizare Cursă'}">Previzualizare Cursă</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal()" th:text="${translations != null and translations.containsKey('add_ride.cancel') ? translations.get('add_ride.cancel') : 'Anulează'}">Anulează</button>
                <button type="button" class="btn btn-primary" onclick="submitRide()" th:text="${translations != null and translations.containsKey('add_ride.confirm') ? translations.get('add_ride.confirm') : 'Confirmă Adăugarea'}">Confirmă Adăugarea</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="/js/script.js?v=1.8"></script>
    <script src="/js/locality-autocomplete.js"></script>
    <script src="/js/add-ride.js?v=1.5"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/city-translations.js"></script>
    <script src="/js/package-translations.js"></script>
    <script src="/js/floating-button.js"></script>
</body>
</html>
