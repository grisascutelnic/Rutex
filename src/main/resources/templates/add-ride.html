<!DOCTYPE html>
<html lang="ro" th:lang="${currentLanguage}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Postează o cursă nouă pe Rutex.md. Împărtășește drumul tău și economisește costurile de transport. Simplu și rapid pentru șoferi din Moldova.">
    <meta name="keywords" content="postează cursă, adaugă cursă, ride sharing Moldova, împărtășește drumul, transport Moldova">
    <meta name="author" content="Rutex">
    <title th:text="${currentLanguage == 'ru' ? 'Создать объявление - Rutex' : 'Adaugă anunț - Rutex'}">Adaugă anunț - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/phone-visibility-confirmation.css?v=1.3">
    <link rel="stylesheet" href="/css/styles.css?v=1.47">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css">
    <link rel="stylesheet" href="/css/ride-form.css?v=3.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
</head>
<body class="add-ride-page">
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="add-ride-container">
                <div th:replace="~{fragments/ride-form :: rideForm(false)}"></div>
            </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 th:text="${translations != null and translations.containsKey('add_ride.preview_title') ? translations.get('add_ride.preview_title') : (currentLanguage == 'ru' ? 'Предварительный просмотр поездки' : 'Previzualizare Cursă')}">Previzualizare Cursă</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal()" th:text="${translations != null and translations.containsKey('add_ride.cancel') ? translations.get('add_ride.cancel') : (currentLanguage == 'ru' ? 'Отмена' : 'Anulează')}">Anulează</button>
                <button type="button" class="btn btn-primary" onclick="submitRide()" th:text="${translations != null and translations.containsKey('add_ride.confirm') ? translations.get('add_ride.confirm') : (currentLanguage == 'ru' ? 'Подтвердить добавление' : 'Confirmă Adăugarea')}">Confirmă Adăugarea</button>
            </div>
        </div>
    </div>

    <div id="ride-success-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="ride-success-title">
        <div class="modal-content ride-success-modal-content">
            <div class="modal-body ride-success-body">
                <div class="ride-success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h3 id="ride-success-title" th:text="${currentLanguage == 'ru' ? 'Объявление опубликовано!' : 'Anunțul a fost publicat!'}">Anunțul a fost publicat!</h3>
                <p th:text="${currentLanguage == 'ru' ? 'Поделитесь им на Facebook, чтобы больше людей увидели вашу поездку.' : 'Distribuie-l pe Facebook ca mai mulți oameni să vadă anunțul tău.'}">Distribuie-l pe Facebook ca mai mulți oameni să vadă anunțul tău.</p>
            </div>
            <div class="modal-footer ride-success-actions">
                <button type="button" class="btn btn-facebook-share" onclick="sharePublishedRideOnFacebook()">
                    <i class="fab fa-facebook-f"></i>
                    <span th:text="${currentLanguage == 'ru' ? 'Поделиться на Facebook' : 'Distribuie pe Facebook'}">Distribuie pe Facebook</span>
                </button>
                <button type="button" class="btn btn-outline" onclick="viewPublishedRide()">
                    <i class="fas fa-arrow-right"></i>
                    <span th:text="${currentLanguage == 'ru' ? 'Посмотреть объявление' : 'Vezi anunțul'}">Vezi anunțul</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="/js/script.js?v=1.9"></script>
    <script src="/js/locality-autocomplete.js"></script>
    <script src="/js/ride-form-language.js?v=1.0"></script>
    <script src="/js/ride-form-controls.js?v=1.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="/js/profile-phone-input.js?v=1.0"></script>
    <script src="/js/phone-visibility-confirmation.js?v=1.5"></script>
    <script src="/js/add-ride.js?v=3.3"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/city-translations.js"></script>
    <script src="/js/package-translations.js?v=1.1"></script>
    <script src="/js/floating-button.js"></script>
</body>
</html>
