<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conectează-te la contul tău Rutex pentru a accesa călătorii împărtășite. Logare rapidă și sigură pentru utilizatorii platformei de ride sharing din Moldova.">
    <meta name="keywords" content="logare Rutex, conectare cont, ride sharing Moldova, autentificare">
    <meta name="author" content="Rutex">
    <title>Logare - Rutex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Analytics -->
    <div th:replace="~{fragments/google-analytics :: google-analytics}"></div>
</head>
<body>
    <!-- Include Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1><i class="fas fa-sign-in-alt"></i> <span th:text="${translations != null and translations.containsKey('login.title') ? translations.get('login.title') : 'Logare'}">Logare</span></h1>
                        <p th:text="${translations != null and translations.containsKey('login.welcome') ? translations.get('login.welcome') : 'Bine ai revenit! Conectează-te la contul tău'}">Bine ai revenit! Conectează-te la contul tău</p>
                    </div>

                    <div th:if="${param.oauthError != null}" class="auth-inline-error" style="margin-bottom: 1rem;">
                        <div class="auth-inline-error-content">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:text="${currentLanguage == 'ru'
                                ? 'Авторизация Google не удалась. Проверь OAuth Consent Screen (Test Users/Production) и Redirect URI в Google Cloud.'
                                : 'Autentificarea Google a eșuat. Verifică OAuth Consent Screen (Test Users/Production) și Redirect URI în Google Cloud.'}">
                                Autentificarea Google a eșuat. Verifică OAuth Consent Screen (Test Users/Production) și Redirect URI în Google Cloud.
                            </span>
                        </div>
                        <small th:if="${param.oauthCode != null}" class="auth-inline-error-code"
                               th:text="${'oauthCode: ' + param.oauthCode}">oauthCode: unknown</small>
                    </div>

                    <div class="auth-social-top">
                        <a th:href="@{/oauth2/authorization/google}" class="auth-btn google-auth-btn" aria-label="Continuă cu Google">
                            <span class="google-auth-icon" aria-hidden="true">
                                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" focusable="false">
                                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.27 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.841 1.154 7.957 3.043l5.657-5.657C34.046 6.053 29.27 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.841 1.154 7.957 3.043l5.657-5.657C34.046 6.053 29.27 4 24 4c-7.681 0-14.41 4.337-17.694 10.691z"/>
                                    <path fill="#4CAF50" d="M24 44c5.165 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.147 35.091 26.715 36 24 36c-5.249 0-9.62-3.316-11.283-7.946l-6.522 5.025C9.438 39.556 16.227 44 24 44z"/>
                                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.056 12.056 0 0 1-4.084 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                                </svg>
                            </span>
                            <span class="google-auth-text">Continuă cu Google</span>
                        </a>
                        <div class="auth-divider">sau</div>
                    </div>

                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                <span th:text="${translations != null and translations.containsKey('login.email') ? translations.get('login.email') : 'Email'}">Email</span>
                            </label>
                            <input type="email" id="email" name="email" th:placeholder="${translations != null and translations.containsKey('login.email_placeholder') ? translations.get('login.email_placeholder') : 'Introduceți adresa de email'}" required>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                <i class="fas fa-lock"></i>
                                <span th:text="${translations != null and translations.containsKey('login.password') ? translations.get('login.password') : 'Parolă'}">Parolă</span>
                            </label>
                            <div class="password-input-wrapper">
                                <input type="password" id="password" name="password" th:placeholder="${translations != null and translations.containsKey('login.password_placeholder') ? translations.get('login.password_placeholder') : 'Introduceți parola'}" required>
                                <button type="button" class="password-toggle-btn" onclick="togglePassword('password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="login-btn" class="auth-btn">
                            <i class="fas fa-sign-in-alt"></i>
                            <span th:text="${translations != null and translations.containsKey('login.submit') ? translations.get('login.submit') : 'Conectare'}">Conectare</span>
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p><span th:text="${translations != null and translations.containsKey('login.no_account') ? translations.get('login.no_account') : 'Nu ai cont?'}">Nu ai cont?</span> <a th:href="@{'/' + ${currentLanguage} + '/register'}" class="auth-link" onclick="saveCurrentUrlAndRedirect(event, this.href)" th:text="${translations != null and translations.containsKey('login.register') ? translations.get('login.register') : 'Înregistrează-te aici'}">Înregistrează-te aici</a></p>
                        <a th:href="@{'/' + ${currentLanguage} + '/forgot-password'}" class="auth-link" th:text="${translations != null and translations.containsKey('login.forgot_password') ? translations.get('login.forgot_password') : 'Ai uitat parola?'}">Ai uitat parola?</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="/js/password-toggle.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/language-selector.js"></script>
    <script src="/js/script.js?v=1.8"></script>
</body>
</html>
